[project]
name = "warroom"
version = "0.1.0"
description = "AI Agent 기반 서비스 장애 탐지 및 대응 자동화"
requires-python = ">=3.13"
dependencies = [
    "warroom-common",
    "warroom-gateway",
    "warroom-orchestrator",
    "warroom-chatops",
    "warroom-github",
    "python-dotenv",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
warroom-common = { workspace = true }
warroom-gateway = { workspace = true }
warroom-orchestrator = { workspace = true }
warroom-chatops = { workspace = true }
warroom-github = { workspace = true }

[dependency-groups]
dev = [
    "markdown>=3.10.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-docx>=1.2.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "packages/common/tests",
    "packages/gateway/tests",
    "packages/orchestrator/tests",
    "packages/chatops/tests",
    "packages/github/tests",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# DTZ 만 강제 — naive datetime 호출 차단 (common.clock 사용 강제).
# 다른 lint 룰은 코드 정리 우선순위가 정해지면 그때 추가.
select = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# clock 모듈은 helper 정의 자체. APP_TZ 인자 명시 사용이라 DTZ 면제.
"packages/common/common/clock.py" = ["DTZ"]
# build 산출물 / 외부 라이브러리류 제외
"packages/*/build/**" = ["DTZ"]
