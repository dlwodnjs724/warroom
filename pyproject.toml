[project]
name = "warroom"
version = "0.1.0"
description = "AI Agent 기반 서비스 장애 탐지 및 대응 자동화"
requires-python = ">=3.13"
dependencies = [
    "warroom-common",
    "warroom-gateway",
    "warroom-orchestrator",
    "warroom-chatops",
    "warroom-github",
    "python-dotenv",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
warroom-common = { workspace = true }
warroom-gateway = { workspace = true }
warroom-orchestrator = { workspace = true }
warroom-chatops = { workspace = true }
warroom-github = { workspace = true }

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "ruff>=0.16.1",
    "sentry-sdk>=2.66.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "packages/common/tests",
    "packages/gateway/tests",
    "packages/orchestrator/tests",
    "packages/chatops/tests",
    "packages/github/tests",
]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["packages/*/build/**", "alembic/versions/**"]

[tool.ruff.lint]
# 권장 세트:
#   E,F  : pycodestyle errors + pyflakes (기본)
#   I    : isort — import 정렬
#   B    : flake8-bugbear — 흔한 버그 패턴
#   UP   : pyupgrade — 구식 문법 현대화
#   SIM  : flake8-simplify — 단순화 가능 패턴
#   DTZ  : flake8-datetimez — naive datetime 차단 (common.clock 강제)
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]
# 라인 길이는 format 이 알아서 처리 → E501 은 제외
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# clock 모듈은 helper 정의 자체. APP_TZ 인자 명시 사용이라 DTZ 면제.
"packages/common/common/clock.py" = ["DTZ"]
# demo.py / gateway/main.py: load_dotenv() / 조건부 import 후 모듈 import — 의도된 패턴
"demo.py" = ["E402"]
"packages/gateway/gateway/main.py" = ["E402"]
# alembic env.py: sys.path 조작 후 import
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
