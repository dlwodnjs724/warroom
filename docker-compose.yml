services:
  mysql:
    image: mysql:8.0
    container_name: warroom-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: warroom
      MYSQL_USER: warroom
      MYSQL_PASSWORD: warroom
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwarroom", "-pwarroom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
