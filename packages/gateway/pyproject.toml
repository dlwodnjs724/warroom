[project]
name = "warroom-gateway"
version = "0.1.0"
description = "Event Gateway - FastAPI webhook receiver"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "warroom-common",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncmy>=0.2",
    "alembic>=1.18.4",
]

[tool.uv.sources]
warroom-common = { workspace = true }
