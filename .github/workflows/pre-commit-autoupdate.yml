name: pre-commit autoupdate

on:
  schedule:
    - cron: "0 9 * * 1"  # 매주 월요일 09:00 UTC
  workflow_dispatch:  # 수동 트리거 허용

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install workspace
        run: uv sync --all-extras --dev

      - name: pre-commit autoupdate
        run: uv run pre-commit autoupdate

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "🔧 chore(ci): pre-commit autoupdate"
          title: "🔧 chore(ci): pre-commit autoupdate"
          body: |
            `pre-commit autoupdate` 가 hook rev 를 갱신했습니다 (주간 cron).
            CI 가 ruff format/check + pytest 로 회귀를 검증합니다.
          branch: "ci/pre-commit-autoupdate"
          delete-branch: true
