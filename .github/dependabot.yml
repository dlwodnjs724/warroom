version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🔧 chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🔧 chore(deps)"
      include: "scope"
    groups:
      dev-deps:
        dependency-type: "development"
      runtime-deps:
        dependency-type: "production"
